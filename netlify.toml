# Netlify Production Configuration for CodeNPixels (https://codenpixels.in)

[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"


# Custom 404 Error Page
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# SPA Fallback for dynamic client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control for immutable compiled assets (JS, CSS, Images, Fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache-Control for root HTML documents
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://api.web3forms.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.web3forms.com; frame-ancestors 'none';"
